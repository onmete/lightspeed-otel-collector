# Collector configuration reference.
# All available fields are shown with their defaults.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 20
        tls:
          cert_file: /var/run/secrets/serving-cert/tls.crt
          key_file: /var/run/secrets/serving-cert/tls.key
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 20971520
        tls:
          cert_file: /var/run/secrets/serving-cert/tls.crt
          key_file: /var/run/secrets/serving-cert/tls.key

processors:
  batch:
    timeout: 1s
    send_batch_size: 100

exporters:
  postgres:
    # Required. PostgreSQL DSN. Pool tuning via DSN params:
    # ?pool_max_conns=10&pool_max_conn_idle_time=5m
    connection_string: "postgres://otel:otel@localhost:5432/oteldb?sslmode=require"
    schema: templogs          # default: templogs
    logs_table: logs          # default: logs

    retry_on_failure:
      enabled: true           # default: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m

    sending_queue:
      enabled: true           # default: true
      num_consumers: 4
      queue_size: 1000
      storage: file_storage

  agentic:
    actions_directory: /var/lib/lightspeed-data-collection/actions
    transcripts_directory: /var/lib/lightspeed-data-collection/transcripts
    max_backlog_bytes: 4194304

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  postgres_admin:
    endpoint: 0.0.0.0:8080    # default: 0.0.0.0:8080
    connection_string: "postgres://otel:otel@localhost:5432/oteldb?sslmode=require"
    schema: templogs          # default: templogs
    logs_table: logs          # default: logs
    # TLS serving cert (required in production, omit for local dev):
    tls_cert_file: /var/run/secrets/serving-cert/tls.crt
    tls_key_file: /var/run/secrets/serving-cert/tls.key

  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true
    compaction:
      on_start: true
      directory: /var/lib/otelcol/file_storage/compaction

  https_metrics:
    endpoint: 0.0.0.0:8888        # default: 0.0.0.0:8888
    upstream: http://127.0.0.1:18888/metrics  # default
    tls_cert_file: /var/run/secrets/serving-cert/tls.crt
    tls_key_file: /var/run/secrets/serving-cert/tls.key

service:
  extensions: [health_check, file_storage, postgres_admin, https_metrics]

  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [postgres]

    # Accept traces so the OTLP receiver doesn't return UNIMPLEMENTED.
    # Retain the nop sink while exporting agentic candidates as JSONL.
    traces:
      receivers: [otlp]
      exporters: [nop, agentic]

  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '127.0.0.1'
                port: 18888
                without_type_suffix: true
                without_units: true
